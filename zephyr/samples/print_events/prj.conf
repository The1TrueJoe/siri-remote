# Minimal config to exercise the siri_remote module.
CONFIG_LOG=y
CONFIG_SIRI_REMOTE=y

# Bluetooth LE central + GATT client + bonding.
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y

# The remote sends 82/101-byte notifications regardless of the negotiated ATT
# MTU (PROTOCOL.md §7), so size the RX path to hold a whole frame.
CONFIG_BT_L2CAP_RX_MTU=110
CONFIG_BT_BUF_ACL_RX_SIZE=120
CONFIG_BT_BUF_ACL_RX_COUNT_EXTRA=6

# Enough stack for the notify callbacks.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
